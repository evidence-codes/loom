name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-tests (Chrome is preinstalled on the runner)
        run: npm test
        env:
          LOOM_CHROME: /usr/bin/google-chrome
